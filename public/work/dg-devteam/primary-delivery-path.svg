<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">DG DevTeam primary delivery path</title>
  <desc id="desc">A software delivery workflow moves from brief and planning through shared contracts, parallel backend and frontend implementation, QA and review gates, then documented release. QA or review failures loop back to the responsible implementation owner.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c35"/><stop offset="1" stop-color="#091224"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00d4ff"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b6387"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff"/></marker>
    <style>
      .kicker { fill:#00d4ff; font:600 18px Arial,sans-serif; letter-spacing:4px; } .heading { fill:#f1f7ff; font:700 38px Arial,sans-serif; } .sub { fill:#91a4c1; font:400 20px Arial,sans-serif; }
      .step { fill:url(#surface); stroke:#2c4266; stroke-width:2; } .step-accent { fill:url(#surface); stroke:#00d4ff; stroke-width:2; } .step-number { fill:#00d4ff; font:700 17px Arial,sans-serif; letter-spacing:2px; } .step-title { fill:#f1f7ff; font:700 23px Arial,sans-serif; } .step-copy { fill:#aabbd3; font:400 17px Arial,sans-serif; }
      .label { fill:#7f96b7; font:600 15px Arial,sans-serif; letter-spacing:1.5px; } .decision { fill:#0c1930; stroke:#00d4ff; stroke-width:2; } .decision-text { fill:#e7f6ff; font:700 18px Arial,sans-serif; } .line { fill:none; stroke:#4b6387; stroke-width:3; marker-end:url(#arrow); } .line-accent { fill:none; stroke:#00d4ff; stroke-width:3; marker-end:url(#arrow-accent); } .loop { fill:none; stroke:#fbbf24; stroke-width:3; stroke-dasharray:9 8; marker-end:url(#arrow); } .loop-label { fill:#fcd34d; font:600 16px Arial,sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="920" rx="36" fill="#07101f"/>
  <g opacity=".28" stroke="#203757" stroke-width="1"><path d="M80 104h1440M80 204h1440M80 304h1440M80 404h1440M80 504h1440M80 604h1440M80 704h1440M80 804h1440"/><path d="M120 64v792M280 64v792M440 64v792M600 64v792M760 64v792M920 64v792M1080 64v792M1240 64v792M1400 64v792"/></g>
  <text x="90" y="104" class="kicker">DG DEVTEAM / PRIMARY DELIVERY PATH</text><text x="90" y="154" class="heading">A workflow designed for clear ownership.</text><text x="90" y="190" class="sub">Shared decisions unlock parallel work; quality gates make delivery accountable.</text>
  <path d="M330 366H390M650 366H710M970 366H1030M1290 366H1350M1430 454V500H1070V550M950 650H865M630 650H550" class="line-accent"/>
  <g transform="translate(90 286)"><rect class="step-accent" width="240" height="160" rx="18"/><text x="24" y="36" class="step-number">01 / FRAME</text><text x="24" y="78" class="step-title">Brief &amp; context</text><text x="24" y="110" class="step-copy">Requirements, prior decisions,</text><text x="24" y="135" class="step-copy">and delivery constraints.</text></g>
  <g transform="translate(410 286)"><rect class="step-accent" width="240" height="160" rx="18"/><text x="24" y="36" class="step-number">02 / PLAN</text><text x="24" y="78" class="step-title">Story tracker</text><text x="24" y="110" class="step-copy">Scope, acceptance criteria,</text><text x="24" y="135" class="step-copy">owners, and dependencies.</text></g>
  <g transform="translate(730 286)"><rect class="step-accent" width="240" height="160" rx="18"/><text x="24" y="36" class="step-number">03 / CONTRACT</text><text x="24" y="78" class="step-title">Shared decisions</text><text x="24" y="110" class="step-copy">Architecture, data, UI,</text><text x="24" y="135" class="step-copy">and API contract.</text></g>
  <g transform="translate(1050 286)"><rect class="step-accent" width="240" height="160" rx="18"/><text x="24" y="36" class="step-number">04 / BUILD</text><text x="24" y="78" class="step-title">Implementation</text><text x="24" y="110" class="step-copy">Backend and frontend work</text><text x="24" y="135" class="step-copy">in parallel when safe.</text></g>
  <g transform="translate(1370 316)"><path class="decision" d="M60 0L120 50L60 100L0 50Z"/><text x="60" y="45" class="decision-text" text-anchor="middle">READY</text><text x="60" y="68" class="decision-text" text-anchor="middle">FOR QA?</text></g><text x="1318" y="516" class="label">CODE + TEST HANDOFF</text>
  <g transform="translate(950 570)"><rect class="step-accent" width="240" height="160" rx="18"/><text x="24" y="36" class="step-number">05 / VERIFY</text><text x="24" y="78" class="step-title">QA gate</text><text x="24" y="110" class="step-copy">Acceptance checks and</text><text x="24" y="135" class="step-copy">full regression suite.</text></g>
  <g transform="translate(630 570)"><rect class="step" width="240" height="160" rx="18"/><text x="24" y="36" class="step-number">06 / INSPECT</text><text x="24" y="78" class="step-title">Review</text><text x="24" y="110" class="step-copy">Security, data, performance,</text><text x="24" y="135" class="step-copy">accessibility, and quality.</text></g>
  <g transform="translate(310 570)"><rect class="step" width="240" height="160" rx="18"/><text x="24" y="36" class="step-number">07 / DELIVER</text><text x="24" y="78" class="step-title">Docs &amp; release</text><text x="24" y="110" class="step-copy">README, SPECS, PR,</text><text x="24" y="135" class="step-copy">deployment, session log.</text></g>
  <path d="M1050 730C1050 830 1170 832 1170 760V466" class="loop"/><text x="665" y="850" class="loop-label">FAILURE OR CRITICAL FINDING → RESPONSIBLE OWNER → QA AGAIN</text>
  <circle cx="1470" cy="366" r="7" fill="#00d4ff" filter="url(#glow)"/><circle cx="1070" cy="650" r="7" fill="#00d4ff" filter="url(#glow)"/><circle cx="750" cy="650" r="7" fill="#00d4ff" filter="url(#glow)"/>
</svg>
